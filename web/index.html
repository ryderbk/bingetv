<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Binge — minimal TV launcher for BingeBang, Rivestream and more. Open streaming sites in a clean full-screen WebView.">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph -->
  <meta property="og:title" content="Binge TV Launcher">
  <meta property="og:description" content="Minimal TV launcher for your favourite streaming sites.">
  <meta property="og:type" content="website">

  <!-- PWA / Icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Binge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Binge — TV Launcher</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0; padding: 0;
      background: #000000;
      height: 100%;
      overflow: hidden;
    }
    /* Splash loader shown until Flutter initialises */
    #binge-splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000000;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #binge-splash h1 {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 3.5rem; font-weight: 900;
      color: #FFD600;
      letter-spacing: 0.05em;
      margin: 0 0 12px;
    }
    #binge-splash p {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.1rem; color: #7C3AED;
      margin: 0;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #4C1D95;
      border-top-color: #FFD600;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 32px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Splash shown during Flutter boot -->
  <div id="binge-splash">
    <h1>Binge</h1>
    <p>Choose a site</p>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide splash once Flutter has rendered first frame
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('binge-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
